name: build
# main: builds the branded image and pushes ghcr.io/tomdowling/ds-social-poster:<postiz version> (+ :latest).
# Pull requests: the same build, nothing pushed (proves the branding still applies).
# The Postiz version lives in one place: ARG POSTIZ_VERSION in the Dockerfile.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Postiz version from the Dockerfile
        run: echo "POSTIZ_VERSION=$(sed -n 's/^ARG POSTIZ_VERSION=//p' Dockerfile)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: POSTIZ_VERSION=${{ env.POSTIZ_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tomdowling/ds-social-poster:${{ env.POSTIZ_VERSION }}
            ghcr.io/tomdowling/ds-social-poster:${{ env.POSTIZ_VERSION }}-${{ github.run_number }}
            ghcr.io/tomdowling/ds-social-poster:latest
