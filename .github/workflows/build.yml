name: build
# Builds the branded image and pushes ghcr.io/tomdowling/ds-social-poster:<postiz version> (+ :latest).
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  POSTIZ_VERSION: v2.25.0

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: POSTIZ_VERSION=${{ env.POSTIZ_VERSION }}
          push: true
          tags: |
            ghcr.io/tomdowling/ds-social-poster:${{ env.POSTIZ_VERSION }}
            ghcr.io/tomdowling/ds-social-poster:${{ env.POSTIZ_VERSION }}-${{ github.run_number }}
            ghcr.io/tomdowling/ds-social-poster:latest
